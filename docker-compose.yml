# =============================================================================
#  Self-contained PRODUCTION stack: app + db (MariaDB) + redis + queue + scheduler.
#
#  Run:
#    cp .env.example .env        # then set APP_ENV=production, APP_DEBUG=false,
#                                # APP_KEY (php artisan key:generate), DB_*/REDIS_* as below
#    docker compose up -d --build
#
#  For development use a separate file:
#    docker compose -f compose.dev.yaml up
#
#  By default the stack is FULLY isolated (its own DB and redis in containers).
#  To connect to an already existing external DB — set DB_HOST to the external
#  address and comment out the `db` service + its depends_on.
#
#  IMPORTANT (network/TLS): the stack serves the app over PLAIN HTTP and publishes
#  it on the LOOPBACK interface only (127.0.0.1:APP_PORT -> 8000, auto_https off).
#  Docker writes its own iptables rules, so a port published on 0.0.0.0 would be
#  reachable from the internet even with ufw/firewalld denying it. The intended
#  setup is nginx on the same host terminating TLS and proxying the domain to
#  http://127.0.0.1:APP_PORT (see docker/nginx.conf.example). Behind HTTPS set
#  TRUSTED_PROXIES (the container sees nginx as the docker bridge gateway, see
#  .env.example); SESSION_SECURE_COOKIE is enabled automatically in production.
#
#  Resource limits (mem_limit/cpus) and log rotation (logging) below are a
#  conservative STARTING point for a single host; tune them for your load.
# =============================================================================

services:
  app:
    build:
      context: .
      target: prod
    image: ${APP_IMAGE:-laravel-admin-template}:latest
    container_name: ${APP_CONTAINER_NAME:-admin-template}-app
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Opt in for first boot or a release; existing data is never re-seeded.
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
      # Base RBAC is initialized once on an empty database when migrations run.
      # RUN_SEEDS adds initial users only on that first initialization. In production,
      # leave it "false" and create the admin via `app:create-admin`, or set
      # RUN_SEEDS=true with ADMIN_PASSWORD before the first boot.
      RUN_SEEDS: "${RUN_SEEDS:-false}"
      # nginx on the host reaches the container through the docker bridge gateway
      # (172.x.0.1). The port is bound to 127.0.0.1, so only local processes get
      # here and trusting the bridge range is safe. Override in .env if needed.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.16.0.0/12}"
    ports:
      # Loopback only: nginx on this host proxies to it. Never publish on 0.0.0.0.
      - "127.0.0.1:${APP_PORT:-8888}:8000"
    volumes:
      # User data only. Code and vendor live inside the image (immutable).
      - storage-data:/app/storage
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness: GET /up checks the database and writable storage only. The queue
      # backlog is NOT part of it (a long job must not mark the web container
      # unhealthy, and queue/scheduler wait for this check); see /up?full=1.
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Resource limits (compose v2, non-swarm honors mem_limit/cpus).
    cpus: "1.5"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  queue:
    # Queue worker: processes Jobs (media uploads/replacements UploadMedia and
    # manual backups CreateBackup). Don't want a worker — set QUEUE_CONNECTION=sync in .env and
    # don't bring up this service: the jobs run right inside the app HTTP request. The
    # trade-off and details are in the README (Troubleshooting / Docker section).
    image: ${APP_IMAGE:-laravel-admin-template}:latest
    container_name: ${APP_CONTAINER_NAME:-admin-template}-queue
    restart: unless-stopped
    env_file: [.env]
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEEDS: "false"
      OPTIMIZE: "false"
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - storage-data:/app/storage
    networks: [internal]
    depends_on:
      # service_healthy ⇒ app has already passed entrypoint (migrations applied, the
      # jobs table exists) — the worker doesn't go into a restart loop on a cold start.
      # /up does not look at the queue, so a backlog cannot keep the worker that
      # would drain it from starting. restart: unless-stopped remains a safety net.
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The worker has no HTTP endpoint: liveness = artisan responds and the DB is reachable.
      test: ["CMD", "php", "artisan", "db:show", "--quiet"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpus: "1.0"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    image: ${APP_IMAGE:-laravel-admin-template}:latest
    container_name: ${APP_CONTAINER_NAME:-admin-template}-scheduler
    restart: unless-stopped
    env_file: [.env]
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEEDS: "false"
      OPTIMIZE: "false"
    # schedule:work keeps the scheduler in a single process (no system cron needed).
    # Runs the periodic tasks from routes/console.php — at least the daily
    # cleanup of the activity log (model:prune for activity_log).
    command: php artisan schedule:work
    volumes:
      - storage-data:/app/storage
    networks: [internal]
    depends_on:
      # see queue: we wait for service_healthy so we don't start before migrations.
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    cpus: "0.5"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # MariaDB 12.3 LTS (maintained until June 2029). Pinned to the LTS line so a
    # rebuild never moves the database to another major version on its own.
    image: mariadb:12.3
    container_name: ${APP_CONTAINER_NAME:-admin-template}-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-laravel}
      MARIADB_USER: ${DB_USERNAME:-laravel}
      # DB passwords are MANDATORY — there are no defaults. compose will fail if they aren't set.
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required for the Docker stack (no default)}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required (no default)}
    volumes:
      - db-data:/var/lib/mysql
    networks: [internal]
    # By default we don't publish the port externally (the DB is reachable only inside the network).
    # For debugging, uncomment:
    # ports:
    #   - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    cpus: "1.0"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ${APP_CONTAINER_NAME:-admin-template}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    cpus: "0.5"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  redis-data:
  storage-data:

networks:
  internal:
    driver: bridge
